<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>토마토 계란 볶음밥을 만들자!</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <link rel="stylesheet" href="css/hud.css" />
  </head>
  <body>
    <main id="app" class="app">
      <!-- 시작 화면 -->
      <section
        id="screen-start"
        class="screen screen--start is-active"
        aria-label="시작 화면"
      >
        <div class="start">
          <h1 class="start__title">토마토 계란 볶음밥을<br />만들자!</h1>
          <p class="start__subtitle">신선한 재료로 따끈한 볶음밥을 완성하세요</p>
          <button id="btn-start" class="btn btn--primary" type="button">
            게임 시작
          </button>
        </div>
      </section>

      <!-- 게임 플레이 화면 (HUD는 grain-3에서 채워진다) -->
      <section
        id="screen-play"
        class="screen screen--play"
        aria-label="게임 플레이 화면"
        aria-hidden="true"
      >
        <div id="play-root" class="play" tabindex="-1">
          <!-- 점수 / 생명력 HUD (grain-3) -->
          <header class="hud" aria-label="게임 상태">
            <div class="hud__badge hud__badge--score">
              <span class="hud__label">점수</span>
              <span
                class="hud__score-value"
                id="hud-score"
                aria-live="polite"
                aria-atomic="true"
                >0</span
              >
            </div>
            <div class="hud__badge hud__badge--life">
              <span class="hud__label">생명력</span>
              <div
                class="hud__hearts"
                id="hud-hearts"
                role="img"
                aria-label="생명력"
              >
                <!-- 하트 아이콘은 js/hud.js가 렌더링한다 -->
              </div>
            </div>
          </header>
          <!-- 게임플레이 영역 (후속 grain) -->
        </div>
      </section>
    </main>

    <script src="js/screens.js" defer></script>
    <script src="js/hud.js" defer></script>
  </body>
</html>

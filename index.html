<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>토마토 계란 볶음밥 러너</title>

    <!-- 폰트 로딩: 디스플레이(Jua) + 본문/HUD(Gothic A1) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700&family=Jua&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/title.css" />
    <link rel="stylesheet" href="styles/hud.css" />
  </head>
  <body>
    <!-- 게임 무대 컨테이너 -->
    <div id="game-root">
      <!-- 횡스크롤 무대가 그려지는 캔버스 -->
      <canvas id="game-canvas" role="img" aria-label="요리 재료 러너 게임 화면"></canvas>

      <!-- 화면 위 UI(타이틀/HUD/게임오버)가 마운트되는 오버레이 루트 -->
      <div id="overlay-root">
        <!-- 메인 타이틀 화면: 캔버스 위에 겹쳐지는 진입 오버레이 -->
        <section class="title-screen" data-title-screen aria-labelledby="title-logo">
          <!-- 배경에 부유/파랄랙스로 떠다니는 재료 장식(JS가 채운다) -->
          <div class="title-ambient" data-title-ambient aria-hidden="true"></div>

          <div class="title-content">
            <h1 class="title-logo" id="title-logo">토마토 계란 볶음밥</h1>
            <p class="title-tagline">재료를 모아 달려라!</p>
            <div class="title-actions">
              <button type="button" class="button" data-start-button>게임 시작</button>
            </div>
          </div>
        </section>

        <!-- 플레이 중 점수·재료 현황 HUD: 캔버스 위 상단에 겹쳐지는 비침투적 오버레이 -->
        <div class="hud" data-hud data-status="idle" aria-hidden="true">
          <div class="hud__bar">
            <div class="hud__primary">
              <div class="hud__score">
                <span class="hud__label">점수</span>
                <span class="hud__score-value" data-hud-score>0</span>
              </div>
              <div class="hud__telemetry">
                <div class="hud__stat">
                  <span class="hud__label">거리</span>
                  <span class="hud__stat-value" data-hud-distance>0m</span>
                </div>
                <div class="hud__stat">
                  <span class="hud__label">속도</span>
                  <span class="hud__stat-value" data-hud-speed>1.0x</span>
                  <span class="hud__gauge" aria-hidden="true">
                    <span class="hud__gauge-fill" data-hud-speed-gauge></span>
                  </span>
                </div>
              </div>
            </div>
            <!-- 재료 종류별 타일(토마토/계란/밥)은 hud.js가 채운다 -->
            <div class="hud__materials" data-hud-materials role="group" aria-label="수집 재료 현황"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 모듈 진입점 -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
